name: Build BassShake exe

on:
  workflow_dispatch:      # lets you click "Run workflow" manually
  push:
    branches: [ main ]    # also auto-builds whenever you push to main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe with PyInstaller
        run: pyinstaller --onefile --noconsole --name BassShake main.py

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BassShake-exe
          path: dist/BassShake.exe
